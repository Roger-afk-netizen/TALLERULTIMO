name: Deploy to GitHub Pages

on:
  push:
    branches:
      - blue

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
          git checkout green
          cp -r build/* .
          git add .
          git commit -m "Deploy from blue to green"
          git push origin green

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          ref: green

      - name: Run tests
        run: |
          # Aquí puedes agregar tus comandos de prueba, por ejemplo:
          curl -Is http://yourusername.github.io/your-repo-name | head -n 1

  rollback:
    runs-on: ubuntu-latest
    needs: test
    if: failure()
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          ref: green

      - name: Rollback to previous version
        run: |
          git reset --hard HEAD~1
          git push origin green --force
