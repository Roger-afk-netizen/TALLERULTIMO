name: Deploy to GitHub Pages

on:
  push:
    branches:
      - blue

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Install dependencies
      run: |
        npm install
        # Añade aquí otros comandos de instalación según tu proyecto

    - name: Build the site
      run: npm run build

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Run tests
      run: |
        curl -I http://localhost:4000
        # Añade aquí otros comandos de testing según tus necesidades

  rollback:
    runs-on: ubuntu-latest
    needs: test
    if: failure()
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Revert to green branch
      run: |
        git checkout green
        git merge blue --abort  # Abort the merge if tests fail
        git push origin green

    - name: Deploy green branch
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build
